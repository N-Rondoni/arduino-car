<!DOCTYPE html>
<!--
  BLE UART terminal for HM-10 / CC2541 modules.

  TO CHANGE THE COMMAND BUTTONS: find the <div class="pad"> block below and
  edit the data-cmd attribute (what gets sent) and the label text (what the
  student sees). Nothing else needs to change.

  REQUIREMENTS: Chrome or Edge. Safari and Firefox do not support Web
  Bluetooth. Must be served over https:// — opening this file directly from
  disk will not work.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Control</title>
<style>
  :root {
    --paper:   #eaedf0;
    --panel:   #ffffff;
    --ink:     #16191c;
    --muted:   #61696f;
    --rule:    #c3cad0;
    --live:    #0b6e4f;
    --idle:    #8a9199;
    --sent:    #9c4600;
    --recv:    #0b6e4f;
    --warn:    #a11f2c;
    --mono:    ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans:    system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 20px 40px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    max-width: 720px;
    margin-inline: auto;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- status beacon: mirrors the module's own LED ---- */
  .beacon {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 4px;
    margin-bottom: 20px;
  }
  .lamp {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--idle);
    flex-shrink: 0;
  }
  .beacon[data-state="live"] .lamp { background: var(--live); }
  .beacon[data-state="idle"] .lamp { animation: pulse 1s steps(1) infinite; }
  @keyframes pulse { 50% { opacity: 0.15; } }
  @media (prefers-reduced-motion: reduce) {
    .beacon[data-state="idle"] .lamp { animation: none; opacity: 0.4; }
  }
  .beacon-text { flex: 1; min-width: 0; }
  .beacon-state {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .beacon-name {
    font-size: 17px;
    font-weight: 600;
    margin-top: 2px;
  }

  button {
    font-family: var(--sans);
    font-size: 15px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 12px 18px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }

  #link { font-weight: 600; }

  /* ---- command buttons ---- */
  .pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .pad button { padding: 20px 8px; font-size: 16px; font-weight: 500; }
  .pad .wide { grid-column: span 3; }

  /* ---- free text entry ---- */
  .entry { display: flex; gap: 8px; margin-bottom: 20px; }
  .entry input {
    flex: 1;
    font-family: var(--mono);
    font-size: 15px;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: var(--panel);
    color: var(--ink);
    min-width: 0;
  }
  .entry input:focus-visible { outline: 2px solid var(--live); outline-offset: -1px; }

  /* ---- log ---- */
  #log {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.7;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 14px 16px;
    height: 260px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #log div { display: flex; gap: 10px; }
  #log .mark { color: var(--muted); flex-shrink: 0; }
  .tx { color: var(--sent); }
  .rx { color: var(--recv); }
  .er { color: var(--warn); }
  .sy { color: var(--muted); }

  .logbar {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
  }
  .logbar button { padding: 5px 12px; font-size: 13px; }

  .opts {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 22px;
    margin-top: 14px;
    font-size: 13px;
    color: var(--muted);
  }
  .opt {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .opts select {
    font-family: var(--mono);
    font-size: 13px;
    padding: 5px 8px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: var(--panel);
    color: var(--ink);
  }

  #unsupported {
    display: none;
    padding: 16px 18px;
    border: 1px solid var(--warn);
    border-radius: 4px;
    color: var(--warn);
    background: var(--panel);
    margin-bottom: 20px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div id="unsupported">
  This browser can't reach Bluetooth devices. Open the page in Chrome or Edge —
  Safari and Firefox don't support Web Bluetooth.
</div>

<div class="beacon" id="beacon" data-state="off">
  <span class="lamp"></span>
  <span class="beacon-text">
    <span class="beacon-state" id="state">Not connected</span>
    <div class="beacon-name" id="name">No device</div>
  </span>
  <button id="link">Connect</button>
</div>

<!-- EDIT THESE: data-cmd is what gets sent, the text is the label -->
<div class="pad">
  <button data-cmd="left"    disabled>Left</button>
  <button data-cmd="forward" disabled>Forward</button>
  <button data-cmd="right"   disabled>Right</button>
  <button data-cmd="on"      disabled>LED on</button>
  <button data-cmd="back"    disabled>Back</button>
  <button data-cmd="off"     disabled>LED off</button>
  <button data-cmd="stop" class="wide" disabled>Stop</button>
</div>

<div class="entry">
  <input id="entry" placeholder="One command, or several separated by spaces" autocomplete="off" disabled>
  <button id="send" disabled>Send</button>
</div>

<div id="log"></div>

<div class="logbar">
  <button id="clear">Clear log</button>
</div>

<div class="opts">
  <div class="opt">
    <label for="ending">Line ending</label>
    <select id="ending">
      <option value="&#10;">Newline — for word commands</option>
      <option value="">None — for single characters</option>
    </select>
  </div>
  <div class="opt">
    <label for="gap">Gap between commands</label>
    <select id="gap">
      <option value="150">As fast as possible</option>
      <option value="500">0.5 s</option>
      <option value="1000" selected>1 s</option>
      <option value="2000">2 s</option>
    </select>
  </div>
</div>

<script>
const SERVICE = 0xFFE0;   // HM-10 transparent UART service
const CHANNEL = 0xFFE1;   // read/write/notify characteristic
const CHUNK   = 20;       // HM-10 MTU limit, bytes per write

let device = null;
let channel = null;
let inbox = '';
let flushTimer = null;

const el = id => document.getElementById(id);
const pad = [...document.querySelectorAll('.pad button')];

if (!navigator.bluetooth) {
  el('unsupported').style.display = 'block';
  el('link').disabled = true;
}

function log(text, kind) {
  const marks = { tx: '>', rx: '<', er: '!', sy: '·' };
  const row = document.createElement('div');
  const mark = document.createElement('span');
  mark.className = 'mark';
  mark.textContent = marks[kind] || ' ';
  const body = document.createElement('span');
  body.className = kind;
  body.textContent = text;
  row.append(mark, body);
  el('log').append(row);
  el('log').scrollTop = el('log').scrollHeight;
}

function setState(state, label, deviceName) {
  el('beacon').dataset.state = state;
  el('state').textContent = label;
  el('name').textContent = deviceName || 'No device';
  const live = state === 'live';
  pad.forEach(b => b.disabled = !live);
  el('entry').disabled = !live;
  el('send').disabled = !live;
  el('link').textContent = live ? 'Disconnect' : 'Connect';
}

async function connect() {
  try {
    setState('idle', 'Choosing device', null);
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE] }]
    });
    device.addEventListener('gattserverdisconnected', dropped);

    setState('idle', 'Connecting', device.name);

    // First GATT connect fails intermittently; retry a couple of times.
    let server = null;
    for (let attempt = 1; attempt <= 3; attempt++) {
      try { server = await device.gatt.connect(); break; }
      catch (err) {
        if (attempt === 3) throw err;
        log('Connection attempt ' + attempt + ' failed, retrying', 'sy');
        await new Promise(r => setTimeout(r, 1000));
      }
    }

    const service = await server.getPrimaryService(SERVICE);
    channel = await service.getCharacteristic(CHANNEL);
    await channel.startNotifications();
    channel.addEventListener('characteristicvaluechanged', received);

    setState('live', 'Connected', device.name);
    log('Connected to ' + (device.name || 'device'), 'sy');
  } catch (err) {
    if (err.name === 'NotFoundError') {
      setState('off', 'Not connected', null);   // user closed the picker
    } else {
      setState('off', 'Connection failed', null);
      log(err.message, 'er');
    }
  }
}

function dropped() {
  channel = null;
  setState('off', 'Disconnected', null);
  log('Device disconnected', 'sy');
}

function disconnect() {
  if (device && device.gatt.connected) device.gatt.disconnect();
  else dropped();
}

// HM-10 delivers one or two characters at a time. Buffer them and flush on a
// newline, or after a short pause if the device never sends one.
function received(event) {
  inbox += new TextDecoder().decode(event.target.value);
  clearTimeout(flushTimer);
  let cut;
  while ((cut = inbox.search(/[\r\n]/)) !== -1) {
    const line = inbox.slice(0, cut).trim();
    inbox = inbox.slice(cut + 1);
    if (line) log(line, 'rx');
  }
  if (inbox) flushTimer = setTimeout(() => {
    if (inbox.trim()) log(inbox.trim(), 'rx');
    inbox = '';
  }, 250);
}

async function send(text) {
  if (!channel) return;
  const payload = new TextEncoder().encode(text + el('ending').value);
  try {
    for (let i = 0; i < payload.length; i += CHUNK) {
      const piece = payload.slice(i, i + CHUNK);
      if (channel.writeValueWithoutResponse) await channel.writeValueWithoutResponse(piece);
      else await channel.writeValue(piece);
      await new Promise(r => setTimeout(r, 25));
    }
    log(text, 'tx');
  } catch (err) {
    log('Send failed: ' + err.message, 'er');
  }
}

// Splits "l f r" into three commands and sends them in order, pausing between
// each so the car has time to actually do something before the next arrives.
let running = false;

async function sendSequence(text) {
  const steps = text.trim().split(/\s+/).filter(Boolean);
  if (!steps.length || running) return;

  running = true;
  el('send').disabled = true;
  if (steps.length > 1) log(steps.length + ' commands queued', 'sy');

  for (let i = 0; i < steps.length; i++) {
    if (!channel) { log('Sequence stopped — device disconnected', 'er'); break; }
    await send(steps[i]);
    if (i < steps.length - 1) {
      await new Promise(r => setTimeout(r, Number(el('gap').value)));
    }
  }

  running = false;
  el('send').disabled = !channel;
}

el('link').onclick = () => channel ? disconnect() : connect();
pad.forEach(b => b.onclick = () => send(b.dataset.cmd));
el('send').onclick = () => {
  const text = el('entry').value;
  if (text) { sendSequence(text); el('entry').value = ''; }
};
el('entry').onkeydown = e => { if (e.key === 'Enter') el('send').click(); };
el('clear').onclick = () => el('log').textContent = '';

setState('off', 'Not connected', null);
log('Ready. Press Connect and pick your module from the list.', 'sy');
</script>

</body>
</html>
